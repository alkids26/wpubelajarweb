<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Rich Media Tags</title>
  </head>
  <body>
    <h3>Video Player</h3>
    <video controls poster="media/thumbnail.png" width="300">
      <source type="video/mp4" src="media/video.mp4" />

      <source type="video/webm" src="media/video.webm" />
      Browser tidak mendukung video player
    </video>

    <hr />

    <h3>Audio Player</h3>
    <audio controls>
      <source src="media/lagu.mp3" />
      Browser tidak mendukung audio player
    </audio>
  </body>
</html>
