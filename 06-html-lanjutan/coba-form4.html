<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Elemen Form </title>
</head>
<body>
  <h1>Contoh Elemen-Elemen Form Pada HTML</h1>

  <form>
    <table>
      <tr>
        <td align="right">
          <label for="nama">Nama:</label>
        </td>
        <td>
          <input type="text" name="nama" id="nama" placeholder="Masukkan Nama Anda">
        </td>
      </tr>
      <tr>
        <td align="right"><label for="password">Password:</label></td>
        <td>
          <input type="password" name="password" id="password" placeholder="Masukkan Password">
        </td>
      </tr>
      <tr>
        <td align="right">
          <label for="email">Email:</label>
        </td>
        <td>
          <input type="email" name="email" id="email" placeholder="Masukkan email Anda">
        </td>
      </tr>
      <tr>
        <td colspan="2"><button type="submit">Kirim</button>
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
